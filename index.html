<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="穿搭配色">
<meta name="mobile-web-app-capable" content="yes">
<title>穿搭配色工具</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
:root{--bg:#f2f0eb;--panel:#fff;--ink:#202833;--muted:#707782;--line:#e1ddd4;--navy:#203a59;--soft:#f7f5f0;--shadow:0 10px 28px rgba(32,38,44,.06)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button{font:inherit} .app{max-width:1180px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:15px}
h1{font-size:27px;line-height:1.15;margin:0} .sub{font-size:13px;color:var(--muted);margin-top:6px}
.badge{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--muted)}
.panel,.card{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)} .panel{border-radius:18px;padding:15px;margin-bottom:14px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mode button,.chip{border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.mode button{border-radius:12px;padding:11px 10px;font-weight:800}
.mode button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.label{font-size:12px;font-weight:800;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:7px;border-radius:11px;padding:8px 10px;font-size:13px}
.chip.active{outline:2px solid var(--navy);outline-offset:1px}
.dot{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.status{margin-top:12px;background:var(--soft);border-radius:11px;padding:9px 11px;font-size:13px}
.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border-radius:18px;overflow:hidden}
.cardHead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.plan{background:var(--navy);color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:850}
.plan.backup{background:#6f7780} .assetId{font-size:11px;color:var(--muted)}
.photo{position:relative;aspect-ratio:3/4;background:#f0f0ef;display:grid;place-items:center;overflow:hidden}
.photo img{display:block;width:auto;height:96%;max-width:100%;object-fit:contain;object-position:center center;transform:translateY(-2.5%)}
.imgState{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#f0f0ef;color:var(--muted);font-size:13px;line-height:1.6}
.imgState.error{color:#a33} .info{padding:9px 13px 13px}
.row{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed #ebe7df;align-items:center}
.row:last-child{border-bottom:0} .key{font-size:12px;color:var(--muted)} .val{font-size:13px;font-weight:750}
.hatChoices{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.hatChoice{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:750;padding:1px 3px;border-radius:5px;cursor:pointer}
.hatChoice:hover{background:#f0eee9}
.hatChoice.active{background:var(--navy);color:#fff}
.hatSep{color:#a8a39a;font-weight:500}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:13px 0 2px}
@media(max-width:820px){.app{padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))} header{align-items:flex-start;flex-direction:column;gap:8px} h1{font-size:22px} .badge{display:none} .results{grid-template-columns:1fr}}
</style>
</head>
<body>

<main class="app">
<header>
  <div>
    <h1>穿搭配色工具</h1>
    <div class="sub">5×5・25 套｜A / B / C 固定推薦｜帽色可切換</div>
  </div>
  <div class="badge">GitHub PWA v19R9</div>
</header>

<section class="panel">
  <div class="mode">
    <button id="topBtn" type="button">以上衣選色</button>
    <button id="pantsBtn" type="button">以褲子選色</button>
  </div>
  <div class="label" id="chooseLabel"></div>
  <div class="chips" id="chips"></div>
  <div class="status" id="status"></div>
</section>

<section class="results" id="results"></section>
<div class="footer">GitHub PWA v19R9｜19 張實際推薦主圖已重製並統一構圖｜帽色切換邏輯沿用 v19。</div>
</main>

<script>
'use strict';
const IMAGE_DATA=Object.freeze({"01.webp":"assets/01.webp","02.webp":"assets/02.webp","03.webp":"assets/03.webp","04.webp":"assets/04.webp","05.webp":"assets/05.webp","06.webp":"assets/06.webp","07.webp":"assets/07.webp","08.webp":"assets/08.webp","09.webp":"assets/09.webp","10.webp":"assets/10.webp","11.webp":"assets/11.webp","12.webp":"assets/12.webp","13.webp":"assets/13.webp","14.webp":"assets/14.webp","15.webp":"assets/15.webp","16.webp":"assets/16.webp","17.webp":"assets/17.webp","18.webp":"assets/18.webp","19.webp":"assets/19.webp","20.webp":"assets/20.webp","21.webp":"assets/21.webp","22.webp":"assets/22.webp","23.webp":"assets/23.webp","24.webp":"assets/24.webp","25.webp":"assets/25.webp","01_hat2.webp":"assets/01_hat2.webp","04_hat2.webp":"assets/04_hat2.webp","10_hat2.webp":"assets/10_hat2.webp","11_hat2.webp":"assets/11_hat2.webp","12_hat2.webp":"assets/12_hat2.webp","14_hat2.webp":"assets/14_hat2.webp","15_hat2.webp":"assets/15_hat2.webp","16_hat2.webp":"assets/16_hat2.webp","20_hat2.webp":"assets/20_hat2.webp","22_hat2.webp":"assets/22_hat2.webp","23_hat2.webp":"assets/23_hat2.webp"});
const ASSETS=Object.freeze({"1":{"id":1,"top":"白","topDetail":"白・寬版短袖 T","pants":"黑","pantsDetail":"黑・寬版西裝褲","shoes":"黑 Converse","filename":"01.webp"},"2":{"id":2,"top":"白","topDetail":"白・寬版短袖 T","pants":"橄欖霧綠","pantsDetail":"橄欖霧綠・工裝寬褲","shoes":"灰色 NB","filename":"02.webp"},"3":{"id":3,"top":"白","topDetail":"白・寬版短袖 T","pants":"牛仔藍","pantsDetail":"牛仔藍・畫家寬褲","shoes":"黑 Converse","filename":"03.webp"},"4":{"id":4,"top":"白","topDetail":"白・寬版短袖 T","pants":"牛仔原漿藍","pantsDetail":"牛仔原漿藍・畫家寬褲","shoes":"黑 Converse","filename":"04.webp"},"5":{"id":5,"top":"白","topDetail":"白・寬版短袖 T","pants":"卡其","pantsDetail":"卡其・工裝寬褲","shoes":"黑 Converse","filename":"05.webp"},"6":{"id":6,"top":"灰","topDetail":"灰・寬版長袖 T","pants":"黑","pantsDetail":"黑・寬版西裝褲","shoes":"灰色 NB","filename":"06.webp"},"7":{"id":7,"top":"灰","topDetail":"灰・寬版長袖 T","pants":"橄欖霧綠","pantsDetail":"橄欖霧綠・工裝寬褲","shoes":"灰色 NB","filename":"07.webp"},"8":{"id":8,"top":"灰","topDetail":"灰・寬版長袖 T","pants":"牛仔藍","pantsDetail":"牛仔藍・畫家寬褲","shoes":"白 Converse","filename":"08.webp"},"9":{"id":9,"top":"灰","topDetail":"灰・寬版長袖 T","pants":"牛仔原漿藍","pantsDetail":"牛仔原漿藍・畫家寬褲","shoes":"黑 Converse","filename":"09.webp"},"10":{"id":10,"top":"灰","topDetail":"灰・寬版長袖 T","pants":"卡其","pantsDetail":"卡其・工裝寬褲","shoes":"白 Converse","filename":"10.webp"},"11":{"id":11,"top":"炭灰","topDetail":"炭灰・寬版帽T","pants":"黑","pantsDetail":"黑・寬版西裝褲","shoes":"灰色 NB","filename":"11.webp"},"12":{"id":12,"top":"炭灰","topDetail":"炭灰・寬版帽T","pants":"橄欖霧綠","pantsDetail":"橄欖霧綠・工裝寬褲","shoes":"灰色 NB","filename":"12.webp"},"13":{"id":13,"top":"炭灰","topDetail":"炭灰・寬版帽T","pants":"牛仔藍","pantsDetail":"牛仔藍・畫家寬褲","shoes":"黑 Converse","filename":"13.webp"},"14":{"id":14,"top":"炭灰","topDetail":"炭灰・寬版帽T","pants":"牛仔原漿藍","pantsDetail":"牛仔原漿藍・畫家寬褲","shoes":"灰色 NB","filename":"14.webp"},"15":{"id":15,"top":"炭灰","topDetail":"炭灰・寬版帽T","pants":"卡其","pantsDetail":"卡其・工裝寬褲","shoes":"灰色 NB","filename":"15.webp"},"16":{"id":16,"top":"藏藍","topDetail":"藏藍・寬鬆休閒襯衫","pants":"黑","pantsDetail":"黑・寬版西裝褲","shoes":"白 Converse","filename":"16.webp"},"17":{"id":17,"top":"藏藍","topDetail":"藏藍・寬鬆休閒襯衫","pants":"橄欖霧綠","pantsDetail":"橄欖霧綠・工裝寬褲","shoes":"灰色 NB","filename":"17.webp"},"18":{"id":18,"top":"藏藍","topDetail":"藏藍・寬鬆休閒襯衫","pants":"牛仔藍","pantsDetail":"牛仔藍・畫家寬褲","shoes":"白 Converse","filename":"18.webp"},"19":{"id":19,"top":"藏藍","topDetail":"藏藍・寬鬆休閒襯衫","pants":"牛仔原漿藍","pantsDetail":"牛仔原漿藍・畫家寬褲","shoes":"灰色 NB","filename":"19.webp"},"20":{"id":20,"top":"藏藍","topDetail":"藏藍・寬鬆休閒襯衫","pants":"卡其","pantsDetail":"卡其・工裝寬褲","shoes":"白 Converse","filename":"20.webp"},"21":{"id":21,"top":"黑","topDetail":"黑・寬版 POLO","pants":"黑","pantsDetail":"黑・寬版西裝褲","shoes":"灰色 NB","filename":"21.webp"},"22":{"id":22,"top":"黑","topDetail":"黑・寬版 POLO","pants":"橄欖霧綠","pantsDetail":"橄欖霧綠・工裝寬褲","shoes":"灰色 NB","filename":"22.webp"},"23":{"id":23,"top":"黑","topDetail":"黑・寬版 POLO","pants":"牛仔藍","pantsDetail":"牛仔藍・畫家寬褲","shoes":"白 Converse","filename":"23.webp"},"24":{"id":24,"top":"黑","topDetail":"黑・寬版 POLO","pants":"牛仔原漿藍","pantsDetail":"牛仔原漿藍・畫家寬褲","shoes":"黑 Converse","filename":"24.webp"},"25":{"id":25,"top":"黑","topDetail":"黑・寬版 POLO","pants":"卡其","pantsDetail":"卡其・工裝寬褲","shoes":"白 Converse","filename":"25.webp"}});
const FIXED=Object.freeze({"top":{"白":{"A":1,"B":5,"C":4},"灰":{"A":6,"B":8,"C":10},"炭灰":{"A":11,"B":15,"C":12},"藏藍":{"A":20,"B":17,"C":16},"黑":{"A":25,"B":23,"C":22}},"pants":{"黑":{"A":11,"B":16,"C":6},"橄欖霧綠":{"A":22,"B":12,"C":17},"牛仔藍":{"A":23,"B":8,"C":3},"牛仔原漿藍":{"A":9,"B":14,"C":24},"卡其":{"A":20,"B":25,"C":5}}});
const ORDER=Object.freeze({"top":["白","灰","炭灰","藏藍","黑"],"pants":["黑","橄欖霧綠","牛仔藍","牛仔原漿藍","卡其"]});
const SWATCH=Object.freeze({"白":"#f5f3ed","灰":"#a4a6a7","炭灰":"#4d5053","藏藍":"#243b5a","黑":"#252628","橄欖霧綠":"#858b73","牛仔藍":"#7796b4","牛仔原漿藍":"#314967","卡其":"#b09b77"});
const HAT_BY_ASSET=Object.freeze({"1":["黑","灰"],"2":["灰"],"3":["黑"],"4":["黑","卡其"],"5":["黑"],"6":["黑"],"7":["黑"],"8":["藏藍"],"9":["黑"],"10":["藏藍","黑"],"11":["灰","黑"],"12":["灰","黑"],"13":["黑","卡其"],"14":["灰","黑"],"15":["黑","灰"],"16":["卡其","黑"],"17":["灰"],"18":["灰","卡其"],"19":["灰","卡其"],"20":["藏藍","灰"],"21":["灰"],"22":["灰","黑"],"23":["黑","灰"],"24":["黑"],"25":["黑"]});
const HAT_ALT_BY_ASSET=Object.freeze({"1":{"color":"灰","filename":"01_hat2.webp"},"4":{"color":"卡其","filename":"04_hat2.webp"},"10":{"color":"黑","filename":"10_hat2.webp"},"11":{"color":"黑","filename":"11_hat2.webp"},"12":{"color":"黑","filename":"12_hat2.webp"},"14":{"color":"黑","filename":"14_hat2.webp"},"15":{"color":"灰","filename":"15_hat2.webp"},"16":{"color":"黑","filename":"16_hat2.webp"},"20":{"color":"灰","filename":"20_hat2.webp"},"22":{"color":"黑","filename":"22_hat2.webp"},"23":{"color":"灰","filename":"23_hat2.webp"}});
const JACKET_BY_ASSET=Object.freeze({"1":["牛仔藍","卡其綠"],"2":["黑","牛仔藍"],"3":["炭灰","卡其綠"],"4":["黑","炭灰"],"5":["黑","炭灰"],"6":["牛仔藍","卡其綠"],"7":["黑","牛仔藍"],"8":["黑","炭灰"],"9":["黑","炭灰"],"10":["黑","炭灰"],"11":["卡其綠","牛仔藍"],"12":["黑","牛仔藍"],"13":["黑","卡其綠"],"14":["黑","卡其綠"],"15":["黑","牛仔藍"],"16":["卡其綠","炭灰"],"17":["黑","炭灰"],"18":["炭灰","黑"],"19":["炭灰","黑"],"20":["黑","炭灰"],"21":["牛仔藍","卡其綠"],"22":["牛仔藍","炭灰"],"23":["卡其綠","炭灰"],"24":["卡其綠","炭灰"],"25":["牛仔藍","炭灰"]});
const $=id=>document.getElementById(id);
const topBtn=$('topBtn'), pantsBtn=$('pantsBtn'), chooseLabel=$('chooseLabel'), chips=$('chips'), status=$('status'), results=$('results');
let mode='top', selected=ORDER[mode][0], renderVersion=0;
function assetById(id){return ASSETS[String(id)];}
function setMode(next){mode=next;selected=ORDER[mode][0];render();}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function row(label,value){return `<div class="row"><div class="key">${escapeHtml(label)}</div><div class="val">${escapeHtml(value)}</div></div>`;}
function hatRow(slot,x){
  const hats=HAT_BY_ASSET[String(x.id)]||[];
  if(hats.length<=1)return row('帽子',hats.join(' / '));
  return `<div class="row"><div class="key">帽子</div><div class="val"><div class="hatChoices">${hats.map((h,i)=>`${i?'<span class="hatSep">/</span>':''}<button type="button" class="hatChoice ${i===0?'active':''}" data-slot="${slot}" data-asset="${x.id}" data-hat-index="${i}">${escapeHtml(h)}</button>`).join('')}</div></div></div>`;
}
function jacketText(x){return (JACKET_BY_ASSET[String(x.id)]||[]).join(' / ');}
function filenameForHat(x,hatIndex){
  if(hatIndex===1){
    const alt=HAT_ALT_BY_ASSET[String(x.id)];
    if(alt)return alt.filename;
  }
  return x.filename;
}
function bindHatChoices(slot,x,version){
  const card=$(`img-${slot}`)?.closest('.card');
  if(!card)return;
  card.querySelectorAll('.hatChoice').forEach(btn=>btn.addEventListener('click',()=>{
    const idx=Number(btn.dataset.hatIndex||0);
    card.querySelectorAll('.hatChoice').forEach(b=>b.classList.toggle('active',b===btn));
    loadImage($(`img-${slot}`),filenameForHat(x,idx),version);
  }));
}
function setImageState(img,message,isError=false){const s=img.parentElement.querySelector('.imgState');s.textContent=message||'';s.classList.toggle('error',!!isError);s.style.display=message?'grid':'none';}
function loadImage(img,filename,version){setImageState(img,'圖片載入中…');const dataUrl=IMAGE_DATA[filename];if(!dataUrl){setImageState(img,`內建圖片不存在：${filename}`,true);return;} img.onload=()=>{if(version!==renderVersion||!img.isConnected||img.dataset.filename!==filename)return;setImageState(img,'');}; img.onerror=()=>{if(version!==renderVersion||!img.isConnected||img.dataset.filename!==filename)return;setImageState(img,`圖片無法顯示：${filename}`,true);}; img.dataset.filename=filename; img.src=dataUrl;}
function cardHtml(slot,x){return `<article class="card"><div class="cardHead"><span class="plan ${slot==='C'?'backup':''}">方案 ${slot}</span><span class="assetId">套裝 #${String(x.id).padStart(2,'0')}</span></div><div class="photo"><img id="img-${slot}" alt="方案 ${slot}，套裝 #${String(x.id).padStart(2,'0')}"><div class="imgState">圖片載入中…</div></div><div class="info">${hatRow(slot,x)}${row('上衣',x.top)}${row('褲子',x.pants)}${row('鞋子',x.shoes)}${row('外套',jacketText(x))}</div></article>`;}
function render(){
  const version=++renderVersion;
  topBtn.classList.toggle('active',mode==='top'); pantsBtn.classList.toggle('active',mode==='pants');
  chooseLabel.textContent=mode==='top'?'選擇上衣顏色':'選擇褲子顏色';
  chips.innerHTML=ORDER[mode].map(c=>`<button type="button" class="chip ${c===selected?'active':''}" data-color="${escapeHtml(c)}"><span class="dot" style="background:${SWATCH[c]||'#ddd'}"></span>${escapeHtml(c)}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{selected=btn.dataset.color;render();}));
  status.innerHTML=`目前條件：<b>${mode==='top'?'上衣':'褲子'}・${escapeHtml(selected)}</b> → 顯示 A / B / C 三組推薦`;
  const rec=FIXED[mode][selected];
  results.innerHTML=['A','B','C'].map(slot=>cardHtml(slot,assetById(rec[slot]))).join('');
  ['A','B','C'].forEach(slot=>{const x=assetById(rec[slot]);loadImage($(`img-${slot}`),x.filename,version);bindHatChoices(slot,x,version);});
}
topBtn.addEventListener('click',()=>setMode('top'));
pantsBtn.addEventListener('click',()=>setMode('pants'));
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => {
      console.warn('Service Worker registration failed:', err);
    });
  });
}
</script>
</body>
</html>
